name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install typescript --no-save

      - name: Build
        run: |
          npx tsc -p tsconfig.json
          cp dist/main.js main.js

      - name: Collect release notes
        id: notes
        run: |
          # 发版说明写在仓库根目录的 RELEASE_NOTES.md（发版前更新它）；
          # 文件为空或不存在就退回自动生成的 commit 列表。
          # 注意：别改成读 tag 附注——那需要 checkout 的 fetch-tags，实测会让 checkout 步骤失败。
          if [ -s RELEASE_NOTES.md ]; then
            echo "mode=file" >> "$GITHUB_OUTPUT"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.notes.outputs.mode }}" = "file" ]; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
