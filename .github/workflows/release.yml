name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要读 tag 的附注消息当 Release 正文，必须有 tag
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install typescript --no-save

      - name: Build
        run: |
          npx tsc -p tsconfig.json
          cp dist/main.js main.js

      - name: Collect release notes
        id: notes
        run: |
          # 发版说明写在 tag 附注里（git tag -a -m "…"）；没写就退回自动生成的 commit 列表
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.notes.outputs.mode }}" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "${GITHUB_REF_NAME#v}" \
              --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
